  translation: Hello, I’m Evelyn
- id: heroTitle
  translation: I’m a software engineer and designer
- id: heroSummary
  translation: "Most days, you’ll find me building interfaces, shaping design systems, and figuring out how to make things work. And documenting it all, because if it’s not documented, does it even exist?"
