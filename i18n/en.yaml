- id: aboutRole
  translation: "Software engineer and designer."
- id: aboutP1
  translation: "I spend most of my time on the development side."
- id: aboutP2
  translation: "I started out in graphic design in 2011. As customizing websites and applications became a bigger part of my work, I wanted to understand how things worked and learn to build them myself. In 2016, I joined {{ .reprograma }}, a front-end bootcamp for women, where I later volunteered, helping other women learn to code. In 2017, I started working as a software engineer."
- id: aboutP3
  translation: "Since then, I’ve worked with startups and teams building apps across e-commerce, healthcare, banking, and aviation, mostly with JavaScript and TypeScript. Angular is what I use most, but I’ve also worked with Vue.js, AngularJS, Hugo, and, on the back end, NestJS and Express. Front-end is where I feel most at home."
- id: aboutP4
  translation: "These days, I’m at Aubay, helping build TAP Air Portugal’s design system from the ground up. I turn designs into working components and libraries that help keep TAP’s products consistent, so teams don’t have to build the same things over and over. I also help guide the front-end technical decisions, bringing design and accessibility into the conversation."
