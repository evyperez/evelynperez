  translation: "She is a reference for everyone who works with her."
- id: t1Quote
  translation: "Evelyn is a dedicated professional and a true Front-end specialist. She is a reference for everyone who works with her. She is creative, engaged, highly active, and extremely competent. I learned so much from her. She always knows what she is talking about and is always ready to help. Concise, objective, and spectacular. It was a great pleasure to work closely with her every day."
