  translation: "É uma referência para quem trabalha com ela."
- id: t1Quote
  translation: "A Evelyn é uma profissional dedicada e especialista em Front-end. É uma referência para quem trabalha com ela e tem muita experiência na área. É criativa, participativa, muito activa e extremamente competente. Aprendi muito com ela! É sempre sucinta, objectiva e espectacular. Foi um prazer enorme trabalhar de perto com ela diariamente."
