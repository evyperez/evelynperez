- id: aboutLabel
  translation: "Sobre mim"
- id: aboutTitle
  translation: "Foi o design que me trouxe"
- id: aboutTitleHighlight
  translation: "Até aqui"
- id: aboutIntro
  translation: "Sou"
- id: aboutRole
  translation: "Engenheira de software e designer."
- id: aboutP1
  translation: "Passo a maior parte do tempo do lado do desenvolvimento."
- id: aboutP2
  translation: "Comecei no design gráfico em 2011. À medida que personalizar sites e aplicações passou a ocupar mais espaço no meu trabalho, quis perceber como as coisas funcionavam e aprender a construí-las eu própria. Em 2016, entrei na {{ .reprograma }}, um bootcamp de front-end para mulheres, onde mais tarde fui voluntária, a ajudar outras mulheres a aprender a programar. Em 2017, comecei a trabalhar como engenheira de software."
- id: aboutP3
  translation: "Desde então, trabalhei com startups e equipas que desenvolvem aplicações de e-commerce, saúde, banca e aviação, sobretudo com JavaScript e TypeScript. O Angular é o que mais uso, mas também já trabalhei com Vue.js, AngularJS, Hugo e, no back-end, NestJS e Express. O front-end é onde me sinto mais em casa."
- id: aboutP4
  translation: "Actualmente, estou na Aubay, a ajudar a construir de raiz o design system da TAP Air Portugal. Transformo designs em componentes e bibliotecas que ajudam a manter os produtos da TAP consistentes, para que as equipas não tenham de construir as mesmas coisas vezes sem conta. Também ajudo a orientar as decisões técnicas de front-end, trazendo o design e a acessibilidade para a conversa."
