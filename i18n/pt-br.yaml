- id: aboutLabel
  translation: "Sobre mim"
- id: aboutTitle
  translation: "Foi o design que me trouxe"
- id: aboutTitleHighlight
  translation: "Até aqui"
- id: aboutIntro
  translation: "Sou"
- id: aboutRole
  translation: "Engenheira de software e designer."
- id: aboutP1
  translation: "Passo a maior parte do tempo no lado do desenvolvimento."
- id: aboutP2
  translation: "Comecei no design gráfico em 2011. Conforme customizar sites e aplicações foi ganhando espaço no meu trabalho, quis entender como as coisas funcionavam e aprender a construí-las eu mesma. Em 2016, entrei na {{ .reprograma }}, um bootcamp de front-end para mulheres, onde depois fui voluntária, ajudando outras mulheres a aprender a programar. Em 2017, comecei a trabalhar como engenheira de software."
- id: aboutP3
  translation: "Desde então, trabalhei com startups e times que constroem aplicações de e-commerce, saúde, bancos e aviação, principalmente com JavaScript e TypeScript. Angular é o que mais uso, mas também já trabalhei com Vue.js, AngularJS, Hugo e, no back-end, NestJS e Express. O front-end é onde me sinto mais em casa."
- id: aboutP4
  translation: "Hoje estou na Aubay, ajudando a construir do zero o design system da TAP Air Portugal. Transformo designs em componentes e bibliotecas que ajudam a manter os produtos da TAP consistentes, para que os times não precisem construir as mesmas coisas várias vezes. Também ajudo a orientar as decisões técnicas de front-end, trazendo design e acessibilidade para a conversa."
