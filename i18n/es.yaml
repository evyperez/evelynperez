- id: aboutLabel
  translation: "Sobre mí"
- id: aboutTitle
  translation: "El diseño me trajo"
- id: aboutTitleHighlight
  translation: "Hasta aquí"
- id: aboutIntro
  translation: "Soy"
- id: aboutRole
  translation: "Ingeniera de software y diseñadora."
- id: aboutP1
  translation: "Paso la mayor parte del tiempo en el lado del desarrollo."
- id: aboutP2
  translation: "Empecé en el diseño gráfico en 2011. A medida que personalizar sitios web y aplicaciones fue ocupando más espacio en mi trabajo, quise entender cómo funcionaban las cosas y aprender a construirlas yo misma. En 2016 entré en {{ .reprograma }}, un bootcamp de front-end para mujeres, donde más tarde fui voluntaria, ayudando a otras mujeres a aprender a programar. En 2017, empecé a trabajar como ingeniera de software."
- id: aboutP3
  translation: "Desde entonces, he trabajado con startups y equipos que desarrollan aplicaciones de e-commerce, salud, banca y aviación, sobre todo con JavaScript y TypeScript. Angular es lo que más uso, pero también he trabajado con Vue.js, AngularJS, Hugo y, en el back-end, NestJS y Express. El front-end es donde me siento más en casa."
- id: aboutP4
  translation: "Hoy estoy en Aubay, ayudando a construir desde cero el design system de TAP Air Portugal. Convierto diseños en componentes y bibliotecas que ayudan a mantener la coherencia de los productos de TAP, para que los equipos no tengan que construir lo mismo una y otra vez. También ayudo a orientar las decisiones técnicas de front-end, incorporando el diseño y la accesibilidad a la conversación."
