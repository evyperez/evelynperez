# Netlify build: compile Sass, then build the Hugo site into public/.
[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.2"
  HUGO_ENV = "production"
  NODE_VERSION = "22"

# Long cache for fingerprinted scripts and the self-hosted fonts.
[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
