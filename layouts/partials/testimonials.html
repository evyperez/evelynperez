<section id="testimonials">
  <div class="container">
    <div class="section-header">
      <h2 class="section-header__title">{{ i18n "testimonialsTitle" }} <em>{{ i18n "testimonialsTitleHighlight" | lower }}</em></h2>
    </div>

    <div class="glide carousel carousel--equal-height" id="testimonials-glide">
      <div class="glide__track" data-glide-el="track">
        <ul class="glide__slides">
          <li class="glide__slide">
            <figure class="testimonial-slide">
              <p class="testimonial-slide__highlight" aria-hidden="true">“{{ i18n "t1Highlight" }}”</p>
              <blockquote class="testimonial-slide__quote"><p>{{ i18n "t1Quote" }}</p></blockquote>
              <figcaption class="testimonial-slide__author">
                <div>
                  <cite><a class="testimonial-slide__name" href="https://www.renantheodoro.dev/en" target="_blank" rel="noopener">{{ i18n "t1Name" }} ↗</a></cite>
                  <p class="testimonial-slide__role">{{ i18n "t1Role" }}</p>
                </div>
              </figcaption>
            </figure>
          </li>

          <li class="glide__slide">
            <figure class="testimonial-slide">
              <p class="testimonial-slide__highlight" aria-hidden="true">“{{ i18n "t2Highlight" }}”</p>
              <blockquote class="testimonial-slide__quote"><p>{{ i18n "t2Quote" }}</p></blockquote>
              <figcaption class="testimonial-slide__author">
                <div>
                  <cite class="testimonial-slide__name">{{ i18n "t2Name" }}</cite>
                  <p class="testimonial-slide__role">{{ i18n "t2Role" }}</p>
                </div>
              </figcaption>
            </figure>
          </li>

          <li class="glide__slide">
            <figure class="testimonial-slide">
              <p class="testimonial-slide__highlight" aria-hidden="true">“{{ i18n "t3Highlight" }}”</p>
              <blockquote class="testimonial-slide__quote"><p>{{ i18n "t3Quote" }}</p></blockquote>
              <figcaption class="testimonial-slide__author">
                <div>
                  <cite class="testimonial-slide__name">{{ i18n "t3Name" }}</cite>
                  <p class="testimonial-slide__role">{{ i18n "t3Role" }}</p>
                </div>
              </figcaption>
            </figure>
          </li>

        </ul>
      </div>

      <div class="carousel__controls">
        <div class="glide__bullets" data-glide-el="controls[nav]">
          <button class="glide__bullet" data-glide-dir="=0" aria-label="{{ i18n "testimonialsGoTo" }} 1"></button>
          <button class="glide__bullet" data-glide-dir="=1" aria-label="{{ i18n "testimonialsGoTo" }} 2"></button>
          <button class="glide__bullet" data-glide-dir="=2" aria-label="{{ i18n "testimonialsGoTo" }} 3"></button>
        </div>
        <div class="carousel__arrows" data-glide-el="controls">
          <button class="carousel__arrow" data-glide-dir="<" aria-label="{{ i18n "testimonialsPrev" }}">←</button>
          <button class="carousel__arrow" data-glide-dir=">" aria-label="{{ i18n "testimonialsNext" }}">→</button>
        </div>
      </div>
    </div>
  </div>
</section>
